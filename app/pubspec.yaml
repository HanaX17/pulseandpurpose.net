name: baby_moments
description: Baby Moments — a private family circle for sharing a baby's photos, videos and growth.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # i18n
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true   # enables gen-l10n from the .arb files
