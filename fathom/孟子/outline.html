<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>孟子 · 极简·脉络</title>
<style>
:root{--bg:#100f17;--panel:#191826;--panel2:#201e30;--ink:#ece9f5;--dim:#a49fc0;
--line:rgba(255,255,255,.10);--coral:#ff6b5e;--good:#4ecb8f;--warn:#f5c451;--bad:#ff6b5e;--radius:14px;
--font:'Bricolage Grotesque',ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;
-webkit-font-smoothing:antialiased}
a{color:var(--coral);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px}
header.top{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.top h1{margin:0;font-size:26px;letter-spacing:-.02em}
.top .sub{color:var(--dim);font-size:14px}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
border-radius:10px;padding:10px 14px;margin:16px 0;color:var(--dim);font-size:13px}
.book{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
padding:18px 20px;margin:16px 0}
.book h2{margin:0 0 2px;font-size:19px}
.book .oneliner{color:var(--dim);font-size:13px;margin:0 0 12px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.badge.pub{color:var(--good);border-color:color-mix(in oklab,var(--good) 45%,transparent)}
.badge.cr{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 45%,transparent)}
.badge.v-PUBLISH{color:var(--good)}.badge.v-HOLD{color:var(--warn)}
.fmt{display:grid;grid-template-columns:110px 1fr auto;gap:10px 14px;align-items:center;
padding:10px 0;border-top:1px solid var(--line)}
.fmt .name{font-weight:600;font-size:14px}
.fmt .name small{display:block;color:var(--dim);font-weight:400;font-size:11px}
.fmt .state{font-size:12px;color:var(--dim)}
.fmt .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);
background:var(--panel2);color:var(--ink)}
.btn:hover{border-color:var(--coral);text-decoration:none}
.audio{font-size:12px;color:var(--dim)}
.audio audio{height:30px;vertical-align:middle}
.voicebox{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.voicebox audio{height:30px;vertical-align:middle;max-width:210px}
.vtoggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vtoggle button{font:inherit;font-size:12px;padding:4px 11px;background:var(--panel2);color:var(--dim);
border:none;cursor:pointer;line-height:1.4}
.vtoggle button.on{background:var(--coral);color:#fff}
.vtoggle button:not(.on):hover{color:var(--ink)}
.missing{color:var(--dim);font-size:12px;opacity:.6}
/* reading view */
article{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px}
article h1{font-size:24px;margin:.2em 0 .6em}article h2{font-size:20px;margin:1.3em 0 .5em}
article h3{font-size:17px;margin:1.1em 0 .4em}
article blockquote{margin:1em 0;padding:6px 16px;border-left:3px solid var(--coral);color:var(--dim)}
article code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:.9em}
article hr{border:none;border-top:1px solid var(--line);margin:1.6em 0}
.back{display:inline-block;margin-bottom:16px;font-size:13px}
.foot{margin-top:40px;color:var(--dim);font-size:12px;text-align:center}
/* outline 章节锚下钻 */
.drill{display:flex;flex-direction:column;gap:8px}
.dl-point{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.dl-head{width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:none;cursor:pointer;
padding:12px 14px;display:flex;align-items:center;gap:10px}
.dl-head:hover{background:rgba(255,255,255,.03)}
.dl-caret{color:var(--coral);transition:transform .18s;font-size:12px}
.dl-point.open .dl-caret{transform:rotate(90deg)}
.dl-text{flex:1;font-weight:600;font-size:15px}
.dl-chap{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.dl-panel{display:none;padding:2px 16px 16px;border-top:1px solid var(--line)}
.dl-point.open .dl-panel{display:block}
.dl-tag{display:inline-block;font-size:11px;color:var(--coral);margin:12px 0 6px;letter-spacing:.03em}
.dl-q{font-size:16px;line-height:1.9;padding:2px 0}
.dl-qp{color:var(--dim);font-size:13px}
.dl-deepbody{color:var(--ink);font-size:14px;line-height:1.8}
.dl-deepbody p{margin:.5em 0}.dl-deepbody h2,.dl-deepbody h3{font-size:15px;margin:.6em 0 .3em}
.dl-none{color:var(--dim);font-size:12px;padding:10px 0}
