# Supabase local development config. See https://supabase.com/docs/guides/cli/config
project_id = "baby-moments"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "app.babymoments://login-callback"
additional_redirect_urls = ["app.babymoments://login-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # set true in production

[functions.redeem-invite]
verify_jwt = true

[functions.verify-purchase]
verify_jwt = true
